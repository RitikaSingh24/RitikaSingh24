<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5">
        <animate attributeName="stop-color" values="#4F46E5;#7C3AED;#4F46E5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#6366F1;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <circle cx="120" cy="50" r="2.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="90" r="2" fill="#fff"><animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="35" r="2.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="70" r="2" fill="#fff"><animate attributeName="opacity" values="1;0.1;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="40" r="2.5" fill="#fff"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>

  <path fill="#0D1117" fill-opacity="0.35" d="M0 205 q125 -40 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#0D1117" fill-opacity="0.6" d="M0 225 q125 -35 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V260 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="13s" repeatCount="indefinite"/>
  </path>

  <text x="500" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">
    Ritika Singh
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
  </text>
  <text x="500" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#E9D5FF">
    Computer Science Engineer | Hackathon Winner
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.5s" fill="freeze"/>
  </text>
</svg>
